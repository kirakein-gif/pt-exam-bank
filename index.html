<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PT국시 · 개인 문제은행</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">PT</div>
        <div>
          <h1>PT국시</h1>
          <p>개인용 국가고시 문제은행</p>
        </div>
      </div>

      <section class="side-card">
        <div class="side-title">학습 모드</div>
        <button class="mode-btn active" data-mode="all">전체 랜덤</button>
        <button class="mode-btn" data-mode="wrong">오답만</button>
        <button class="mode-btn" data-mode="favorite">즐겨찾기</button>
      </section>

      <section class="side-card">
        <div class="side-title">문제은행</div>
        <div class="bank-info">
          <strong id="bankName">데모 문제은행</strong>
          <span id="bankCount">3문항</span>
        </div>
        <button id="importBtn" class="secondary-btn">문제은행 불러오기</button>
        <input id="fileInput" type="file" accept=".json,application/json" hidden />
        <button id="useDemoBtn" class="ghost-btn">데모로 전환</button>
        <p class="hint">실제 기출 데이터는 PC에만 저장됩니다.</p>
      </section>

      <section class="side-card stats-card">
        <div class="side-title">오늘 학습</div>
        <div class="stat-row"><span>푼 문제</span><strong id="todayAttempts">0</strong></div>
        <div class="stat-row"><span>정답률</span><strong id="todayAccuracy">0%</strong></div>
        <div class="stat-row"><span>연속 정답</span><strong id="streak">0</strong></div>
      </section>

      <div class="shortcut-note">
        <strong>키보드</strong>
        <span>1~5 답 선택 · N 다음 · F 즐겨찾기</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">PHYSICAL THERAPY EXAM</div>
          <h2 id="modeTitle">전체 랜덤 학습</h2>
        </div>
        <div class="top-actions">
          <button id="resetStatsBtn" class="text-btn">학습기록 초기화</button>
        </div>
      </header>

      <section id="emptyState" class="empty-state hidden">
        <div class="empty-icon">□</div>
        <h3 id="emptyTitle">출제할 문제가 없습니다.</h3>
        <p id="emptyText">다른 학습 모드를 선택하거나 문제은행을 불러오세요.</p>
      </section>

      <section id="quizCard" class="quiz-card">
        <div class="meta-row">
          <span id="setChip" class="chip">데모</span>
          <span id="sessionChip" class="chip">연습</span>
          <span id="subjectChip" class="chip">사용법</span>
          <span id="numberChip" class="chip strong">Q1</span>
        </div>

        <div class="question-block">
          <div class="question-label">QUESTION</div>
          <h3 id="questionText">문제를 불러오는 중입니다.</h3>
          <div id="promptBox" class="prompt-box hidden"></div>
        </div>

        <div id="choices" class="choices"></div>

        <div id="resultBox" class="result-box hidden">
          <div id="resultHeader" class="result-header"></div>
          <div class="answer-line">정답 <strong id="correctAnswer"></strong></div>
          <div class="explanation-title">해설</div>
          <div id="explanation" class="explanation"></div>
          <div id="sourceInfo" class="source-info"></div>
        </div>

        <div class="quiz-footer">
          <button id="favoriteBtn" class="favorite-btn">☆ 즐겨찾기</button>
          <div class="footer-right">
            <span id="progressText" class="progress-text"></span>
            <button id="nextBtn" class="primary-btn" disabled>다음 문제 <span>→</span></button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
